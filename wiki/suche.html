<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KrakWiki24 – Suche</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <a href="/wiki/startseite/index.html">KrakWiki24</a>
  </div>
  <form class="searchbox" action="/wiki/suche.html" method="get">
    <input type="search" name="q" placeholder="Suche im Wiki" value="">
  </form>
</header>

<main class="main">
  <h1>Suchergebnisse</h1>
  <ul id="results"></ul>
</main>

<div class="footer">
  © 2026 KrakWiki24
</div>

<script>
// Beispiel-JSON: hier kommen alle Wiki-Artikel rein
const data = [
  { "title": "Kraken", "description": "Weichtiere mit acht Armen", "links": "/wiki/Kraken.html" },
  { "title": "Deutsche Sprache", "description": "Germanische Sprache", "links": "/wiki/Deutsche_Sprache.html" }
];

// Funktion: Suchbegriff aus URL
function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

// Suche in JSON
function searchJSON(query) {
  if (!query) return [];
  const lowerQuery = query.toLowerCase();
  return data.filter(item =>
    item.title.toLowerCase().includes(lowerQuery) ||
    item.description.toLowerCase().includes(lowerQuery)
  );
}

// Ergebnisse anzeigen
function displayResults(results, query) {
  const ul = document.getElementById("results");
  ul.innerHTML = ""; // vorher löschen

  if (!query) {
    ul.innerHTML = "<li>Bitte Suchbegriff eingeben.</li>";
    return;
  }

  if (results.length === 0) {
    ul.innerHTML = `<li>Keine Ergebnisse für "<strong>${query}</strong>" gefunden.</li>`;
    return;
  }

  results.forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `<strong>${item.title}</strong>: ${item.description}<br>Links: ${item.links.map(link => `<a href="${link}">${link}</a>`).join(", ")}`;
    ul.appendChild(li);
  });
}

// Haupt
const query = getQueryParam("q");
document.querySelector('input[name="q"]').value = query; // Suchfeld füllen
const results = searchJSON(query);
displayResults(results, query);
</script>

</body>
</html>
