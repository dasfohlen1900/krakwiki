<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KrakWiki24 – Suche</title>
<style>
/* Fonts */
h1,h2 { font-family: "Aeropus Serif","Times New Roman",serif; }
body,p,li,a,input,span { font-family: "Aeropus Sans",system-ui,sans-serif; }

body { margin:0; background:#f8f9fa; }
.topbar { display:flex; align-items:center; gap:16px; padding:10px 20px; border-bottom:1px solid #ccc; background:white; }
.logo a { font-size:22px; font-weight:700; text-decoration:none; color:black; }
.searchbox { flex:1; }
.searchbox input { max-width:460px; width:100%; padding:7px 10px; border:1px solid #aaa; border-radius:4px; }

.main { max-width:800px; margin:24px auto; padding:0 16px; }
.results { list-style:none; padding-left:0; }
.results li { padding:10px 0; border-bottom:1px solid #ddd; }
.results li:last-child { border-bottom:none; }
.results a { text-decoration:none; color:#0066cc; font-weight:600; }
.results a:hover { text-decoration:underline; }
.snippet { display:block; color:#444; font-size:0.95em; margin-top:2px; }

.footer { text-align:center; padding:20px; color:#666; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><a href="/wiki/startseite/index.html">KrakWiki24</a></div>
  <form class="searchbox" onsubmit="return false;">
    <input type="search" id="searchInput" placeholder="Suche im Wiki">
  </form>
</header>

<main class="main">
  <h1>Suchergebnisse</h1>
  <ul id="results" class="results"></ul>
</main>

<div class="footer">© 2026 KrakWiki24</div>

<script>
const results = document.getElementById("results");
const input = document.getElementById("searchInput");

let allArticles = [];

// JSON laden
async function initArticles() {
  try {
    const res = await fetch("/wiki/index.json");
    allArticles = await res.json();
  } catch(err) {
    console.error("Fehler beim Laden von index.json", err);
    results.innerHTML = "<li>Fehler beim Laden der Artikel.</li>";
  }
}
initArticles();

// Live-Suche
input.addEventListener("input", () => {
  const q = input.value.toLowerCase();
  if(allArticles.length === 0){ results.innerHTML="<li>Lade Artikel...</li>"; return; }

  const filtered = allArticles.filter(a => 
    a.title.toLowerCase().includes(q) || a.snippet.toLowerCase().includes(q)
  );

  results.innerHTML = filtered.length
    ? filtered.map(a => `<li><a href="/${a.file}">${a.title}</a><span class="snippet">${a.snippet}</span></li>`).join("")
    : "<li>Keine Treffer</li>";
});
</script>

</body>
</html>
